name: Issue Auth Token

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Никнейм покупателя'
        required: true
        default: 'Player'
      days:
        description: 'Дней подписки'
        required: true
        default: '30'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and Send Token
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.PRIVATE_KEY_BASE64 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          USERNAME: ${{ github.event.inputs.username }}
          DAYS: ${{ github.event.inputs.days }}

        run: |
          node <<'NODE'
          const crypto = require("crypto");

          async function main() {
              // Проверяем секреты
              if (!process.env.PRIVATE_KEY_BASE64 ||
                  !process.env.TG_BOT_TOKEN ||
                  !process.env.TG_CHAT_ID) {
                  throw new Error("Не настроены GitHub Secrets.");
              }

              const username = process.env.USERNAME.trim();
              const daysText = process.env.DAYS.trim();

              if (!username || username.includes("|") ||
                  /[\r\n]/.test(username)) {
                  throw new Error("Некорректный никнейм.");
              }

              if (!/^[0-9]+$/.test(daysText)) {
                  throw new Error("Количество дней должно быть числом.");
              }

              const days = Number(daysText);

              if (!Number.isSafeInteger(days) || days < 1 || days > 3650) {
                  throw new Error("Количество дней должно быть от 1 до 3650.");
              }

              // Загружаем приватный ключ из GitHub Secrets
              const privDer = Buffer.from(
                  process.env.PRIVATE_KEY_BASE64,
                  "base64"
              );

              const privateKey = crypto.createPrivateKey({
                  key: privDer,
                  format: "der",
                  type: "pkcs8"
              });

              // Проверяем алгоритм ключа
              if (privateKey.asymmetricKeyType !== "ec" ||
                  privateKey.asymmetricKeyDetails?.namedCurve !== "prime256v1") {
                  throw new Error("Нужен ECDSA P-256 приватный ключ.");
              }

              // Получаем публичный ключ из приватного
              // Приватный ключ никуда не выводится!
              const jwk = crypto.createPublicKey(privateKey).export({
                  format: "jwk"
              });

              const publicKeyHex = Buffer.concat([
                  Buffer.from(jwk.x, "base64url"),
                  Buffer.from(jwk.y, "base64url")
              ]).toString("hex").toUpperCase();

              console.log("================================");
              console.log("AUTH_PUBLIC_KEY=" + publicKeyHex);
              console.log("================================");

              // Создаём токен
              const expires = Math.floor(Date.now() / 1000) +
                              (days * 86400);

              const payload = `${username}|${expires}`;

              const signature = crypto.sign(
                  "sha256",
                  Buffer.from(payload, "utf8"),
                  {
                      key: privateKey,
                      dsaEncoding: "ieee-p1363"
                  }
              );

              const token =
                  `${Buffer.from(payload).toString("base64url")}.` +
                  `${signature.toString("base64url")}`;

              // Отправляем токен в Telegram
              const resp = await fetch(
                  `https://api.telegram.org/bot${process.env.TG_BOT_TOKEN}/sendMessage`,
                  {
                      method: "POST",
                      headers: {
                          "Content-Type": "application/json"
                      },
                      body: JSON.stringify({
                          chat_id: process.env.TG_CHAT_ID,
                          text:
                              `✅ Токен для ${username}\n` +
                              `Срок подписки: ${days} дней\n\n` +
                              `${token}`
                      })
                  }
              );

              const data = await resp.json();

              if (!resp.ok || !data.ok) {
                  throw new Error(
                      "Ошибка Telegram: " + JSON.stringify(data)
                  );
              }

              console.log("Токен успешно отправлен в Telegram.");
          }

          main().catch(error => {
              console.error("ОШИБКА:", error.message);
              process.exit(1);
          });
          NODE
